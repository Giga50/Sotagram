<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sotagram</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="chat">
<header class="chat-header">
<div class="avatar">S</div>
<div class="user-info">
<h2>Sotagram</h2>
<span class="status">общий чат</span>
</div>
</header>
<div class="name-bar">
<input id="usernameInput" type="text" placeholder="Ваше имя..." value="Гость">
</div>
<main class="messages" id="messages"></main>
<form class="chat-form" id="chatForm">
<input id="messageInput" type="text" placeholder="Напишите сообщение..." autocomplete="off">
<button type="submit">➤</button>
</form>
</div>
<script src="script.js"></script>
</body>
</html>
